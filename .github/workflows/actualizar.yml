name: Actualizar radar

on:
  schedule:
    - cron: "0 */3 * * *"   # cada 3 h (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [eventos.json]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests icalendar
      # si un test falla no se publica: la página anterior sigue en línea
      - run: python -m unittest -v test_radar
      - run: python eventos.py
      - name: Guardar historial de eventos vistos
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add eventos.json cache/
          git diff --cached --quiet && exit 0
          git commit -m "datos: $(date -u '+%F %H:%M') UTC"
          # si otra corrida empujó antes, rebasar; si aun así choca, no bloquear la publicación
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done || echo "::warning::no se pudo guardar el historial; se publica igual"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
