name: Actualizar radar

on:
  schedule:
    - cron: "0 */3 * * *"   # cada 3 h (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [eventos.json]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python eventos.py
      - name: Guardar historial de eventos vistos
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add eventos.json
          git diff --cached --quiet || git commit -m "datos: $(date -u '+%F %H:%M') UTC"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
