<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- ícono de la pestaña: el radar de la portada sobre su mismo azul (trazos un poco más firmes para 16 px) -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A56A8"/><stop offset="1" stop-color="#0D2960"/></linearGradient>
    <linearGradient id="barrido" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB27F" stop-opacity="0"/><stop offset="1" stop-color="#FFB27F" stop-opacity=".95"/></linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#fondo)"/>
  <g transform="translate(24 24) scale(.84) translate(-24 -24)">
    <circle cx="24" cy="24" r="22" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.8)" stroke-width="2.6"/>
    <circle cx="24" cy="24" r="14" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/>
    <circle cx="24" cy="24" r="6" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/>
    <path d="M24 24 L24 2 A22 22 0 0 1 43 13 Z" fill="url(#barrido)"/>
    <circle cx="33" cy="15" r="3.2" fill="#FFB27F"/>
  </g>
</svg>
